name = "Stacks"
version = "0.1.0"
defaultTargets = ["StacksCore", "StacksFrontier", "Stacks"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.flexible = true
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
weak.linter.overlappingInstances = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "StacksCore"
roots = ["StacksCore"]

[[lean_lib]]
name = "StacksFrontier"
roots = ["StacksFrontier"]

[[lean_lib]]
name = "Stacks"
roots = ["Stacks"]

[[lean_lib]]
name = "ProjInclusionDegreeBasicAfterRelativeProj"
roots = []
globs = ["StacksFrontier.AlgebraicGeometry.ProjInclusionDegreeSection.Basic"]
needs = ["@Stacks/+StacksFrontier.AlgebraicGeometry.NestedCocycleTail.Basic:olean"]

[[lean_lib]]
name = "ChartTransNonNestedDegreeSectionAfterRigidity"
roots = []
globs = ["StacksFrontier.AlgebraicGeometry.ChartTransNonNested.DegreeSection"]
needs = ["@Stacks/+StacksFrontier.AlgebraicGeometry.ChartCocycleRigidity.DegreeSection:olean"]
